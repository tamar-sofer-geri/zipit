<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zip It!">
  <rect width="512" height="512" fill="#AEDDF5"/>

  <!-- clouds, scattered, varied size/shape, may sit behind the suitcase -->
  <g fill="#FFFFFF">
    <rect x="161.0" y="134.4" width="78.0" height="31.2" rx="15.6"/>
    <circle cx="179.2" cy="150.0" r="19.5"/>
    <circle cx="200.0" cy="142.2" r="16.9"/>
    <circle cx="220.8" cy="152.6" r="14.3"/>

    <rect x="364.0" y="127.8" width="39.0" height="15.6" rx="7.8"/>
    <circle cx="373.7" cy="135.6" r="9.8"/>
    <circle cx="391.9" cy="133.7" r="7.2"/>

    <rect x="80.0" y="288.0" width="60.0" height="24.0" rx="12.0"/>
    <circle cx="94.0" cy="300.0" r="15.0"/>
    <circle cx="110.0" cy="294.0" r="13.0"/>
    <circle cx="126.0" cy="302.0" r="11.0"/>

    <rect x="411.5" y="292.9" width="33.0" height="13.2" rx="6.6"/>
    <circle cx="421.4" cy="300.6" r="6.6"/>
    <circle cx="435.7" cy="298.4" r="7.7"/>

    <rect x="295.5" y="386.2" width="69.0" height="27.6" rx="13.8"/>
    <circle cx="311.6" cy="400.0" r="17.2"/>
    <circle cx="330.0" cy="393.1" r="14.9"/>
    <circle cx="348.4" cy="402.3" r="12.6"/>

    <rect x="139.4" y="395.5" width="42.0" height="16.8" rx="8.4"/>
    <circle cx="149.9" cy="403.9" r="10.5"/>
    <circle cx="169.5" cy="401.8" r="7.7"/>
  </g>

  <!-- telescoping handle -->
  <rect x="214" y="132" width="16" height="60" rx="8" fill="#2B2F33"/>
  <rect x="282" y="132" width="16" height="60" rx="8" fill="#2B2F33"/>
  <rect x="206" y="128" width="100" height="20" rx="10" fill="#2B2F33"/>
  <!-- case body -->
  <rect x="170" y="196" width="172" height="176" rx="24" fill="#4A90D9"/>
  <!-- front pocket -->
  <rect x="188" y="252" width="136" height="88" rx="18" fill="#3B76B8"/>
  <!-- side seam -->
  <rect x="170" y="234" width="172" height="8" fill="#3B76B8"/>
  <!-- wheels -->
  <circle cx="204" cy="380" r="14" fill="#2B2F33"/>
  <circle cx="308" cy="380" r="14" fill="#2B2F33"/>
  <!-- luggage tag -->
  <rect x="330" y="248" width="30" height="22" rx="6" fill="#F0C34A"/>
  <circle cx="336" cy="259" r="3" fill="#AEDDF5"/>
</svg>
